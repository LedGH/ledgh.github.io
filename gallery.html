<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Luke El Dib - Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Bootstrap (same as main site) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- IMPORTANT: absolute path so it loads from anywhere -->
  <link rel="stylesheet" href="/css/styles.css">

  <style>
    /* Match link color from your main page */
    a:link, a:visited, a:hover, a:active { color: #ce2029; }

    /* Tiles: no captions, subtle hover */
    .gallery-item { position: relative; }
    .gallery-item .thumb-wrap {
      position: relative; width: 100%; aspect-ratio: 4/3; overflow: hidden;
      background: #121212;
    }
    .gallery-item img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform .25s ease;
    }
    .gallery-item:hover img { transform: scale(1.03); }

    /* Lightbox */
    .lightbox {
      position: fixed; inset: 0; display: none;
      background: rgba(0,0,0,.92); z-index: 9999;
      align-items: center; justify-content: center;
    }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 95vw; max-height: 90vh; object-fit: contain; }
    .lb-btn {
      position: absolute; top: 18px; background: #ffffff12; color:#fff;
      border: 1px solid #ffffff30; padding: 10px 14px; border-radius: 999px;
      cursor: pointer; backdrop-filter: blur(6px);
    }
    .lb-close { right: 18px; }
    .lb-prev, .lb-next { top: 50%; transform: translateY(-50%); }
    .lb-prev { left: 18px; }
    .lb-next { right: 18px; }
    .lb-btn:hover { background: #ffffff20; }
  </style>
</head>

<body>
  <!-- Same dark-mode toggle markup/id as your main page -->
  <label class="switch">
    <input type="checkbox" id="dark-mode-toggle">
    <span class="slider round"></span>
  </label>

  <main>
    <section>
      <div class="container">
        <div id="name" class="mt-4 mb-2">
          <h2>LUKE <a class="eldib">EL DIB</a></h2>
          
          <h6 style="color:#fe5000;"><i>designer, engineer, developer</i></h6>
        </div>

        <hr style="margin-top: 40px; margin-bottom: 40px;">
        <h1 class="top_text text-center">Gallery</h1>

        <!-- Grid with same spacing vibe as Work -->
        <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 gx-4 gy-4" id="gallery-grid" aria-live="polite"></div>
        <div id="gallery-status" class="text-center" style="opacity:.8; margin:20px 0;"></div>

        <hr style="margin-top: 60px; margin-bottom: 60px;">
      </div>
    </section>
  </main>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox" aria-modal="true" role="dialog">
    <button class="lb-btn lb-close" aria-label="Close">✕</button>
    <button class="lb-btn lb-prev" aria-label="Previous">‹</button>
    <img id="lb-img" alt="" />
    <button class="lb-btn lb-next" aria-label="Next">›</button>
  </div>

  <script>
  /** ====== YOUR REPO CONFIG (no quotes in folder) ====== **/
  const OWNER  = 'LedGH';
  const REPO   = 'ledgh.github.io';
  const FOLDER = photo/content ;  // <- no quotes around this path
  const BRANCH = 'main';
  /** ================================================ **/

  // --- Dark mode memory (same as main page) ---
  (function setupDarkModePersistence() {
    const darkModeToggle = document.getElementById('dark-mode-toggle');
    const pref = localStorage.getItem('darkMode');
    if (pref === 'enabled') { document.body.classList.add('dark-mode'); darkModeToggle.checked = true; }
    darkModeToggle.addEventListener('change', function () {
      if (this.checked) { document.body.classList.add('dark-mode'); localStorage.setItem('darkMode','enabled'); }
      else              { document.body.classList.remove('dark-mode'); localStorage.setItem('darkMode','disabled'); }
    });
  })();

  // --- Gallery logic ---
  const GRID = document.getElementById('gallery-grid');
  const STATUS = document.getElementById('gallery-status');
  const EXT = ['.jpg','.jpeg','.png','.gif','.webp','.avif'];

  const API_URL = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodeURIComponent(FOLDER)}?ref=${encodeURIComponent(BRANCH)}`;
  const RAW_PREFIX = `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${FOLDER}/`;
  const CACHE_KEY = `ghGallery:${OWNER}/${REPO}/${FOLDER}@${BRANCH}`;
  const TTL_MS = 15 * 60 * 1000;

  let files = []; // {name, raw}

  initGallery();

  async function initGallery() {
    try {
      files = await getFolderImages();
      if (!files.length) { STATUS.textContent = 'No images found in this folder.'; return; }
      STATUS.textContent = '';
      renderGrid(files);
      setupLightbox(files);
    } catch (err) {
      console.error(err);
      STATUS.textContent = 'Could not load images. Ensure the repo & folder are public and spelled exactly.';
    }
  }

  async function getFolderImages() {
    const now = Date.now();
    try {
      const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
      if (cached && (now - cached.t) < TTL_MS) return cached.data;
    } catch {}

    const res = await fetch(API_URL, { headers: { 'Accept': 'application/vnd.github+json' }});
    if (!res.ok) throw new Error(`GitHub API ${res.status}`);
    const list = await res.json();

    const items = list
      .filter(it => it.type === 'file' && EXT.some(ext => it.name.toLowerCase().endsWith(ext)))
      .map(it => ({
        name: it.name,
        raw: RAW_PREFIX + encodeURIComponent(it.name)
      }));

    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: now, data: items })); } catch {}
    return items;
  }

  function renderGrid(items) {
    GRID.innerHTML = '';
    items.forEach((f, i) => {
      const col = document.createElement('div');
      col.className = 'col gallery-item';
      col.dataset.index = String(i);
      col.innerHTML = `
        <a href="${f.raw}" class="thumb-wrap" aria-label="${escapeHtml(f.name)}">
          <img loading="lazy" src="${f.raw}" alt="${escapeHtml(f.name)}">
        </a>
      `;
      GRID.appendChild(col);
    });
  }

  // Lightbox (full image on click, no captions)
  function setupLightbox(items) {
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lb-img');
    const btnClose = lb.querySelector('.lb-close');
    const btnPrev = lb.querySelector('.lb-prev');
    const btnNext = lb.querySelector('.lb-next');
    let idx = 0;

    const open = (i) => { idx = i; lbImg.src = items[idx].raw; lbImg.alt = items[idx].name; lb.classList.add('open'); document.body.style.overflow='hidden'; };
    const close = () => { lb.classList.remove('open'); document.body.style.overflow=''; };
    const prev = () => open((idx - 1 + items.length) % items.length);
    const next = () => open((idx + 1) % items.length);

    GRID.addEventListener('click', (e) => {
      const tile = e.target.closest('.gallery-item');
      if (!tile) return;
      e.preventDefault();
      open(parseInt(tile.dataset.index, 10));
    });

    btnClose.addEventListener('click', close);
    btnPrev.addEventListener('click', prev);
    btnNext.addEventListener('click', next);
    lb.addEventListener('click', (e) => { if (e.target === lb) close(); });
    window.addEventListener('keydown', (e) => {
      if (!lb.classList.contains('open')) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowLeft') prev();
      if (e.key === 'ArrowRight') next();
    });
  }

  function escapeHtml(s){ return s.replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }
  </script>
</body>
</html>
